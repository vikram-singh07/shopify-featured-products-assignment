name: Daily job listings

on:
  schedule:
    # 03:17 UTC = 08:47 IST, every day
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  find-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: job-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: job-agent/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Find and score jobs
        run: npm start
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
      - name: Upload CSV backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-csv
          path: job-agent/output/*.csv
          retention-days: 30
          if-no-files-found: ignore
